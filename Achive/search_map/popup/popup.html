<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Map Extension</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Search Map</h1>
          <span class="version">v1.1.0 (Alt+M)</span>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">Sẵn sàng</div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Nhập tên Quận, Huyện, Phường, Xã Hà Nội..." autofocus />
        <button id="clearSearchBtn" class="clear-btn" title="Xóa">×</button>
      </div>

      <!-- Instant Admin Lookup Match Display -->
      <div id="adminResultCard" class="admin-result-card" style="display: none;"></div>

      <div class="provider-selector">
        <button class="provider-btn active" data-provider="gmaps">
          <span>Google Maps</span>
        </button>
        <button class="provider-btn" data-provider="osm">
          <span>OpenStreetMap</span>
        </button>
        <button class="provider-btn" data-provider="bing">
          <span>Bing Maps</span>
        </button>
      </div>

      <button id="searchBtn" class="primary-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        Tìm kiếm địa điểm
      </button>
    </section>

    <!-- Quick Tools Section -->
    <section class="tools-section">
      <h2>Công cụ nhanh</h2>
      <div class="tool-grid">
        <button id="searchSelectionBtn" class="tool-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>Lấy từ khóa bôi đen (Alt + M)</span>
        </button>

        <button id="copyUrlBtn" class="tool-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span>Sao chép Link trang</span>
        </button>
      </div>
    </section>

    <!-- History / Saved Locations -->
    <section class="history-section">
      <div class="section-header">
        <h2>Lịch sử tìm kiếm</h2>
        <button id="clearHistoryBtn" class="text-btn">Xóa tất cả</button>
      </div>
      <ul id="historyList" class="history-list">
        <li class="empty-state">Chưa có lịch sử tìm kiếm</li>
      </ul>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Phím tắt: Bôi đen chữ + bấm <b>Alt + M</b> để tra cứu siêu tốc</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
