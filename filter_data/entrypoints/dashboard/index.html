<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Data Explorer - Tra cứu 80.000 phòng trọ</title>
  </head>
  <body class="dashboard-body">
    <div id="app" class="dashboard-layout">
      <!-- Sidebar Navigation -->
      <aside class="dashboard-sidebar">
        <div class="brand">
          <span class="logo-icon">⚡</span>
          <h2>Filter Data Explorer</h2>
        </div>

        <nav class="nav-menu">
          <a href="#" class="nav-item active">📊 Tra cứu phòng trọ</a>
        </nav>

        <div id="stat-summary-container" class="sidebar-stat-container"></div>
      </aside>

      <!-- Main Explorer Content -->
      <main class="dashboard-main">
        <header class="main-header">
          <div class="search-wrapper" id="search-bar-container"></div>
          <div class="header-actions">
            <span id="dashboard-total-count" class="count-badge">Đang tải...</span>
            <button id="btn-export-json" class="btn btn-outline">📥 Export JSON</button>
            <button id="btn-refresh" class="btn btn-primary">🔄 Làm mới</button>
          </div>
        </header>

        <!-- Filter Bar -->
        <section id="filter-panel-container" class="dashboard-filter-section"></section>

        <!-- Listing Virtual Viewport -->
        <section id="virtual-list-container" class="dashboard-list-section"></section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
