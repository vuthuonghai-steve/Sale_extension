<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Data Explorer - Tra cứu 80.000 phòng trọ</title>
  </head>
  <body class="dashboard-body">
    <div id="app" class="dashboard-layout">
      <!-- Sidebar Navigation -->
      <aside class="dashboard-sidebar">
        <div class="brand">
          <span class="logo-icon">⚡</span>
          <h2>Filter Data Explorer</h2>
        </div>

        <nav class="nav-menu">
          <a href="#" id="tab-available" class="nav-item active">📊 Tra cứu phòng trọ</a>
          <a href="#" id="tab-reconcile" class="nav-item">🔄 Import & Đối Chiếu Data</a>
          <a href="#" id="tab-full-queue" class="nav-item">
            <span>❌ Phòng Hết (FULL Queue)</span>
            <span id="badge-full-count" class="badge-full-count">0</span>
          </a>
        </nav>

        <div id="stat-summary-container" class="sidebar-stat-container"></div>
      </aside>

      <!-- Main Explorer Content -->
      <main class="dashboard-main">
        <header class="main-header">
          <div class="search-wrapper" id="search-bar-container"></div>
          <div class="header-actions">
            <span id="dashboard-total-count" class="count-badge">Đang tải...</span>
            <button id="btn-import-data" class="btn btn-primary-gradient">📥 Import Data</button>
            <button id="btn-refresh" class="btn btn-primary">🔄 Làm mới</button>
          </div>
        </header>

        <!-- Filter Bar -->
        <section id="filter-panel-container" class="dashboard-filter-section"></section>

        <!-- Listing Virtual Viewport (Phòng còn) -->
        <section id="virtual-list-container" class="dashboard-list-section"></section>

        <!-- Reconciliation Viewport (Đối Chiếu & Import Raw) -->
        <section id="reconciliation-container" class="dashboard-list-section" style="display: none;"></section>

        <!-- Full Listings Viewport (Phòng Hết Queue) -->
        <section id="full-listings-container" class="dashboard-list-section" style="display: none;"></section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
